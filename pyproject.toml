[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-evolving-aios-mvp"
version = "0.6.4"
description = "A minimal event-driven, permission-gated AI operating system runtime"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AIOS MVP"}]
dependencies = []

[project.scripts]
aios = "aios.cli:main"
aiosctl = "aios.ctl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
