[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-evolving-aios-mvp"
version = "0.10.0a1"
description = "A minimal reversible self-modification experiment for an agent runtime"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AIOS MVP"}]
dependencies = []

[project.scripts]
aios = "aios.cli:main"
aiosctl = "aios.ctl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aios = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
