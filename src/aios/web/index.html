<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIOS Agent Workbench</title><link rel="stylesheet" href="/app.css"></head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark">A</span><div><strong>AIOS</strong><small>Agent Workbench</small></div></div><div class="environment"><span id="runtime-dot" class="dot"></span><span id="runtime-state">connecting</span><span class="sep"></span><span id="workspace-name">workspace</span><span class="sep"></span><span id="model-name">model</span></div><div class="mode-switch"><button data-mode="normal" class="active">Normal</button><button data-mode="inspect">Inspect</button></div></header>
<main class="shell">
<aside class="tasks-panel"><div class="panel-head"><div><span class="eyebrow">WORK</span><h1>Tasks</h1></div><button id="new-task" class="icon-button" title="New task">＋</button></div><div id="task-groups" class="task-groups"></div></aside>
<section class="work-panel"><div id="empty-state" class="empty-state"><div class="empty-mark">A</div><h2>Give AIOS a task</h2><p>Conversation first. Runtime evidence stays one click away.</p></div><div id="task-view" class="task-view hidden"><div class="task-header"><div><span id="task-id" class="eyebrow"></span><h2 id="task-title"></h2></div><div class="task-actions"><span id="task-status" class="status-pill"></span><button id="retry-task" class="secondary hidden">Retry</button></div></div><nav class="tabs"><button data-tab="chat" class="active">Chat</button><button data-tab="activity">Activity</button><button data-tab="files">Files</button><button data-tab="evidence" class="inspect-only">Evidence</button><button data-tab="evolution" class="inspect-only">Evolution</button></nav><div id="tab-content" class="tab-content"></div></div><form id="composer" class="composer"><textarea id="prompt" rows="1" maxlength="32000" placeholder="Ask AIOS to inspect, build, analyze, or repair…"></textarea><div class="composer-foot"><span>Enter to queue · Shift+Enter for newline</span><button type="submit" class="primary">Run task ↗</button></div></form></section>
<aside class="activity-panel"><div class="panel-head"><div><span class="eyebrow">LIVE</span><h2>Runtime activity</h2></div><span id="event-count" class="counter">0</span></div><div id="activity-stream" class="activity-stream"><p class="muted">Select a task to inspect its execution.</p></div><div id="budget-card" class="budget-card hidden"></div></aside>
</main>
<div id="drawer-backdrop" class="backdrop hidden"></div><aside id="drawer" class="drawer hidden"><div class="drawer-head"><div><span class="eyebrow">EVOLUTION INSPECTOR</span><h2 id="drawer-title">Candidate</h2></div><button id="close-drawer" class="icon-button">×</button></div><div id="drawer-content" class="drawer-content"></div></aside><div id="toast" class="toast hidden"></div><script src="/app.js"></script>
</body></html>
